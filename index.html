<body class="is-loading">
    <canvas id="water-canvas" aria-hidden="true"></canvas>

            <div class="loader-spinner" aria-hidden="true"></div>
            <p class="loader-brand">Palette<span>Pro</span></p>

            </div>
            <span class="loader-percentage" id="loader-percentage" aria-hidden="true">0%</span>
        </div>
    </div>

        <span class="header-info">Since: 2026</span>
        <h1>PalettePro</h1>
        <h2>Donde el color no tiene límites</h2>
        <a class="scroll-cue" href="#generator">
            <span>Desliza para descubrir</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-7-7 7 7 7-7"></path></svg>
        </a>

            <div>
                <label id="pGenerador">Seleccione la cantidad de colores:</label>
                <select id="cantidad" class="native-select" aria-hidden="true" tabindex="-1">
                    <option value="6">6 colores</option>
                    <option value="8">8 colores</option>
                    <option value="9">9 colores</option>
                </select>
                <div class="card-drop" id="menuCantidad">
                    <button class="dropdown-toggle" type="button" aria-expanded="false">
                        <span>6 colores</span>
                        <span class="dropdown-arrow" aria-hidden="true">⌄</span>
                    </button>
                    <ul>
                        <li><a href="#" data-value="6">6 colores</a></li>
                        <li><a href="#" data-value="8">8 colores</a></li>
                        <li><a href="#" data-value="9">9 colores</a></li>
                    </ul>
                </div>
            </div>
            <div class="toggle liquid-toggle">
                <input type="radio" name="mode" id="hex" value="hex" checked>
                <input type="radio" name="mode" id="hsl" value="hsl">
                <div class="slider"></div>
                <label for="hex">HEX</label>
                <label for="hsl">HSL</label>
            </div>
            <button id="generar" class="btn-liquid">
                <span class="inner">Genera tu nueva paleta</span>
