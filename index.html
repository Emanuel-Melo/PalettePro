<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalettePro</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/fluid.js" defer></script>
    <script src="js/button-liquid.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/color.js" defer></script>
    <script src="js/clipboard.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/palette.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/loader.js" defer></script>
</head>
<body class="is-loading">
    <canvas id="water-canvas" aria-hidden="true"></canvas>
    <div class="page-loader" id="page-loader" role="status" aria-live="polite">
        <div class="loader-content">
            <div class="loader-spinner" aria-hidden="true"></div>
            <p class="loader-brand">Palette<span>Pro</span></p>
            <p class="loader-caption">Generando tu paleta de colores...</p>
            <div class="loader-progress" role="progressbar" aria-label="Carga de PalettePro" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="loader-progress-fill" id="loader-progress-fill"></div>
            </div>
            <span class="loader-percentage" id="loader-percentage" aria-hidden="true">0%</span>
        </div>
    </div>
    <header class="hero">
        <span class="header-info">Since: 2026</span>
        <h1>PalettePro</h1>
        <h2>Donde el color no tiene límites</h2>
    </header>
    <main>
        <section class="generator">
            <h3>¡Atrévete a descubrir tu próxima combinación favorita!</h3>
            <div class="palette">
                <div class="color">item 1</div>
                <div class="color">item 2</div>
                <div class="color">item 3</div>
                <div class="color">item 4</div>
                <div class="color">item 5</div>
                <div class="color">item 6</div>
                <div class="color">item 7</div>
                <div class="color">item 8</div>
                <div class="color">item 9</div>
            </div>
            <div>
                <label id="pGenerador">Seleccione la cantidad de colores:</label>
                <select id="cantidad" class="native-select" aria-hidden="true" tabindex="-1">
                    <option value="6">6 colores</option>
                    <option value="8">8 colores</option>
                    <option value="9">9 colores</option>
                </select>
                <div class="card-drop" id="menuCantidad">
                    <button class="dropdown-toggle" type="button" aria-expanded="false">
                        <span>6 colores</span>
                        <span class="dropdown-arrow" aria-hidden="true">⌄</span>
                    </button>
                    <ul>
                        <li><a href="#" data-value="6">6 colores</a></li>
                        <li><a href="#" data-value="8">8 colores</a></li>
                        <li><a href="#" data-value="9">9 colores</a></li>
                    </ul>
                </div>
            </div>
            <div class="toggle liquid-toggle">
                <input type="radio" name="mode" id="hex" value="hex" checked>
                <input type="radio" name="mode" id="hsl" value="hsl">
                <div class="slider"></div>
                <label for="hex">HEX</label>
                <label for="hsl">HSL</label>
            </div>
            <button id="generar" class="btn-liquid">
                <span class="inner">Genera tu nueva paleta</span>
                <canvas aria-hidden="true"></canvas>
            </button>
            <div class="Space"></div>
        </section>
    </main>
</body>
</html>
